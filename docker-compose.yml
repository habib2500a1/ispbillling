# NextDeploy / GitHub auto-deploy
# Panel Domains tab: set primary domain (e.g. anetbd.com) → service app
# Caddy (host) reverse-proxies to this container on port 8020 (NextDeploy default).
# nginx listens on 80 + 8020 so redeploy never breaks regardless of Caddy upstream port.
# Never bind host :80/:443 (Caddy owns them).
#
# Panel .env minimum (copy from .env.example):
#   APP_URL=https://your-domain.com
#   APP_DOMAIN=your-domain.com
#   DB_PASSWORD=strong-secret
#   MYSQL_ROOT_PASSWORD=strong-root-secret
# Do NOT set APP_KEY= (leave unset — container auto-generates on first boot).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ispbilling-app:latest
    restart: unless-stopped
    expose:
      - "80"
      - "8020"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8020/ >/dev/null || curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    env_file:
      - .env
    environment:
      APP_NAME: "${APP_NAME:-ISP Billing}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_DOMAIN: ${APP_DOMAIN:-anetbd.com}
      APP_TIMEZONE: Asia/Dhaka
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mikrotik_billing}
      DB_USERNAME: ${DB_USERNAME:-billing}
      DB_PASSWORD: ${DB_PASSWORD:-billing_secret}
      SESSION_DRIVER: database
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: "true"
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      LOG_CHANNEL: stderr
    labels:
      caddy: "${APP_DOMAIN:-localhost}"
      caddy.reverse_proxy: "{{upstreams 8020}}"
      caddy.header.X-Frame-Options: SAMEORIGIN
      caddy.header.X-Content-Type-Options: nosniff
      caddy.header.Referrer-Policy: strict-origin-when-cross-origin
      caddy.header.X-XSS-Protection: "1; mode=block"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - nextdeploy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mikrotik_billing}
      MYSQL_USER: ${DB_USERNAME:-billing}
      MYSQL_PASSWORD: ${DB_PASSWORD:-billing_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - default

networks:
  nextdeploy:
    external: true
    name: NextDeploy

volumes:
  mysql_data:
  app_storage:
