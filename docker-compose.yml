# ISP Platform — Docker stack (NextDeploy / manual).
# Panel compose path: docker-compose.yml
# Domains tab: service nginx, port 80 (NOT app, NOT 8023). See deploy/README.md

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - isp
      - nextdeploy

  nginx:
    image: nginx:1.27-alpine
    # Host 8023 only for direct test. Caddy proxies ISP_LANDING_DOMAIN → nginx:80 (container port).
    # Do NOT map 80:80 — host port 80 is used by NextDeploy Caddy.
    ports:
      - "8023:80"
    expose:
      - "80"
    labels:
      caddy: ${ISP_LANDING_DOMAIN:-}
      caddy.reverse_proxy: "{{upstreams 80}}"
    volumes:
      - .:/var/www/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - pg_tileserv
    networks:
      - isp
      - nextdeploy

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-isp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isp_secret_change_me}
      APP_DB_USERNAME: ${DB_USERNAME:-isp}
      APP_DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-isp_secret_change_me}}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isp} -d ${POSTGRES_DB:-isp_platform}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - isp

  pg_tileserv:
    image: pramsey/pg_tileserv:20240131
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USERNAME:-isp}:${DB_PASSWORD:-isp_secret_change_me}@postgres:5432/${DB_DATABASE:-isp_platform}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - isp

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-isp-local}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-isp-local-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-isp-local-secret}
      SOKETI_DEBUG: '0'
    expose:
      - "6001"
    networks:
      - isp

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - isp

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    env_file:
      - .env
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$MEILI_MASTER_KEY" ] && [ -n "$$APP_KEY" ]; then
          export MEILI_MASTER_KEY=$$(printf '%s' "$$APP_KEY|isp-customer-search-meili-v1" | sha256sum | awk '{print $$1}')
        fi
        export MEILI_MASTER_KEY=$${MEILI_MASTER_KEY:-isp_meili_docker_internal_v1}
        exec /bin/meilisearch
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - isp

  horizon:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: php artisan horizon
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    networks:
      - isp

  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    networks:
      - isp

  assets:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm ci && npm run build"
    profiles:
      - setup

  mobile-builder:
    image: ghcr.io/cirruslabs/flutter:stable
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    command: bash -lc "chmod +x scripts/*.sh && APP_URL=$$(bash scripts/read-production-url.sh) && ./scripts/deploy-mobile-apks.sh \"$$APP_URL\""
    profiles:
      - mobile

volumes:
  pgdata:
  meilidata:

networks:
  isp:
  nextdeploy:
    external: true
    name: NextDeploy
