# ISP Platform — Docker stack (NextDeploy / manual).
# NextDeploy panel compose path: docker-compose.yml
# Manual: docker compose up -d

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    networks:
      - isp
      - nextdeploy

  nginx:
    image: nginx:1.27-alpine
    # Host 8023 only for direct test. Caddy proxies ISP_LANDING_DOMAIN → nginx:80 (container port).
    # Do NOT map 80:80 — host port 80 is used by NextDeploy Caddy.
    ports:
      - "8023:80"
    expose:
      - "80"
    labels:
      caddy: ${ISP_LANDING_DOMAIN:-}
      caddy.reverse_proxy: "{{upstreams 80}}"
    volumes:
      - .:/var/www/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - isp
      - nextdeploy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-isp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isp_secret_change_me}
      APP_DB_USERNAME: ${DB_USERNAME:-isp}
      APP_DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-isp_secret_change_me}}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - isp

  redis:
    image: redis:7-alpine
    networks:
      - isp

  horizon:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: php artisan horizon
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    networks:
      - isp

  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    networks:
      - isp

  assets:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm ci && npm run build"
    profiles:
      - setup

volumes:
  pgdata:

networks:
  isp:
  nextdeploy:
    external: true
    name: NextDeploy
