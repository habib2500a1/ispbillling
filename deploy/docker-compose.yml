# ISP Platform — Docker stack.
# NextDeploy panel compose path (recommended): docker-compose.yml
# This file also works: deploy/docker-compose.yml

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    networks:
      - isp

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8023:80"
    volumes:
      - .:/var/www/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - isp

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-isp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isp_secret_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - isp

  redis:
    image: redis:7-alpine
    networks:
      - isp

  horizon:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    networks:
      - isp

  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    networks:
      - isp

  assets:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm ci && npm run build"
    profiles:
      - setup

volumes:
  pgdata:

networks:
  isp:
