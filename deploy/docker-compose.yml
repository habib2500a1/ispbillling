# ISP Platform — Docker stack.
# NextDeploy panel compose path (recommended): docker-compose.yml
# This file also works: deploy/docker-compose.yml

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - isp
      - nextdeploy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8023:80"
    expose:
      - "80"
    labels:
      caddy: ${ISP_LANDING_DOMAIN:-}
      caddy.reverse_proxy: "{{upstreams 80}}"
    volumes:
      - .:/var/www/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - isp
      - nextdeploy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-isp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isp_secret_change_me}
      APP_DB_USERNAME: ${DB_USERNAME:-isp}
      APP_DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-isp_secret_change_me}}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isp} -d ${POSTGRES_DB:-isp_platform}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - isp

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - isp

  horizon:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    command: php artisan horizon
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    networks:
      - isp

  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    networks:
      - isp

  assets:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm ci && npm run build"
    profiles:
      - setup

volumes:
  pgdata:

networks:
  isp:
  nextdeploy:
    external: true
    name: NextDeploy
