name: Mobile APKs

# Optional backup — primary flow is server auto-build from .env APP_URL (no GitHub config).
# Manual run only. Server: scripts/auto-mobile-after-deploy.sh

on:
  workflow_dispatch:

concurrency:
  group: mobile-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: vars.APP_URL != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APKs for APP_URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          export COPY_LOCAL=1
          export UPLOAD_GITHUB=0
          APP_URL="${APP_URL%/}"
          echo "Building mobile APKs for domain: ${APP_URL}"
          ./scripts/build-mobile-apk.sh "$APP_URL"
          ./scripts/build-mfs-verify-apk.sh "$APP_URL"
          ./scripts/write-apk-build-info.sh "$APP_URL"
          ls -lh public/downloads/*.apk public/downloads/apk-build-info.json

      - name: Verify API domain baked into Radiant APK
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          APP_URL="${APP_URL%/}"
          API_HOST="$(echo "$APP_URL" | sed -E 's#https?://##')"
          if ! strings public/downloads/isp-radiant.apk | grep -q "${API_HOST}/api/v1"; then
            echo "ERROR: APK does not contain ${API_HOST}/api/v1"
            strings public/downloads/isp-radiant.apk | grep -E 'https?://' | head -20 || true
            exit 1
          fi
          echo "OK: APK targets ${API_HOST}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apks-${{ github.sha }}
          path: |
            public/downloads/isp-radiant.apk
            public/downloads/isp-mfs-verify.apk
            public/downloads/apk-build-info.json
            public/downloads/mfs-verify-version.json
          retention-days: 14

      - name: Deploy APKs to production server (SCP)
        if: ${{ secrets.DEPLOY_SSH_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/isp-platform}"
          SSH_USER="${SSH_USER:-root}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p ${DEPLOY_PATH}/public/downloads"

          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            public/downloads/isp-radiant.apk \
            public/downloads/isp-mfs-verify.apk \
            public/downloads/apk-build-info.json \
            public/downloads/mfs-verify-version.json \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/public/downloads/"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "cd ${DEPLOY_PATH} && \
             chmod 644 public/downloads/*.apk public/downloads/*.json 2>/dev/null || true && \
             chown www-data:www-data public/downloads/*.apk public/downloads/*.json 2>/dev/null || true && \
             ./scripts/use-server-mobile-downloads.sh --write-env && \
             php artisan config:cache --no-interaction 2>/dev/null || true"

          echo ""
          echo "Deployed to ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/public/downloads/"
          echo "Radiant: ${APP_URL}/downloads/isp-radiant.apk"
          echo "MFS:     ${APP_URL}/downloads/isp-mfs-verify.apk"

      - name: Deploy skipped (no SSH secrets)
        if: ${{ secrets.DEPLOY_SSH_HOST == '' || secrets.DEPLOY_SSH_KEY == '' }}
        run: |
          echo "::warning::Set DEPLOY_SSH_HOST + DEPLOY_SSH_KEY in GitHub Actions secrets to auto-upload APKs to your server."
          echo "APK artifacts are still available from this workflow run for manual download."
