name: Mobile APKs

# git push main → build APK for deploy/production.url → publish mobile-production release.
# Server deploy → auto-mobile syncs from mobile-production (domain verified).

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: mobile-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read production URL
        id: url
        run: |
          APP_URL="$(grep -v '^#' deploy/production.url | head -1 | tr -d '[:space:]')"
          APP_URL="${APP_URL%/}"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "Building for: $APP_URL"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APKs
        env:
          APP_URL: ${{ steps.url.outputs.app_url }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          export COPY_LOCAL=1 UPLOAD_GITHUB=0
          ./scripts/build-mobile-apk.sh "$APP_URL"
          ./scripts/build-mfs-verify-apk.sh "$APP_URL"
          ./scripts/write-apk-build-info.sh "$APP_URL"
          strings public/downloads/isp-radiant.apk | grep -q "${APP_URL#https://}/api/v1"
          ls -lh public/downloads/

      - name: Publish mobile-production release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: ${{ steps.url.outputs.app_url }}
        run: |
          TAG=mobile-production
          REPO="${{ github.repository }}"
          NOTES="Deploy APKs for ${APP_URL}. Commit ${{ github.sha }}."
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --title "Mobile production" --notes "$NOTES"
          else
            gh release edit "$TAG" -R "$REPO" --notes "$NOTES" || true
          fi
          gh release upload "$TAG" -R "$REPO" --clobber \
            public/downloads/isp-radiant.apk \
            public/downloads/isp-mfs-verify.apk \
            public/downloads/apk-build-info.json
          echo "https://github.com/${REPO}/releases/tag/${TAG}"

      - name: Deploy to server (optional SCP)
        if: ${{ secrets.DEPLOY_SSH_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
        env:
          APP_URL: ${{ steps.url.outputs.app_url }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/html}"
          SSH_USER="${SSH_USER:-root}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "mkdir -p ${DEPLOY_PATH}/public/downloads"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key public/downloads/isp-radiant.apk public/downloads/isp-mfs-verify.apk public/downloads/apk-build-info.json "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/public/downloads/"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "cd ${DEPLOY_PATH} && ./scripts/use-server-mobile-downloads.sh --write-env && php artisan config:cache --no-interaction 2>/dev/null || true"
