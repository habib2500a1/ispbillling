name: Mobile APKs

# Build APKs for APP_URL and copy to production server (public/downloads/).
# Website download links then use https://APP_URL/downloads/*.apk
#
# GitHub repo Settings → Secrets and variables → Actions:
#   Variable APP_URL          e.g. https://billing.yourisp.com
#   Secret  DEPLOY_SSH_HOST   server IP or hostname
#   Secret  DEPLOY_SSH_USER   e.g. root
#   Secret  DEPLOY_SSH_KEY    private key (PEM)
#   Variable DEPLOY_PATH       e.g. /var/www/isp-platform (optional)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - 'scripts/build-mobile-apk.sh'
      - 'scripts/build-mfs-verify-apk.sh'
      - 'scripts/patch-telephony-android.sh'
      - 'scripts/deploy-mobile-apks.sh'
      - '.github/workflows/mobile-apks.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: vars.APP_URL != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APKs for APP_URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          chmod +x scripts/*.sh
          export COPY_LOCAL=1
          export UPLOAD_GITHUB=0
          ./scripts/build-mobile-apk.sh "$APP_URL"
          ./scripts/build-mfs-verify-apk.sh "$APP_URL"
          ls -lh public/downloads/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apks
          path: |
            public/downloads/isp-radiant.apk
            public/downloads/isp-mfs-verify.apk
            public/downloads/mfs-verify-version.json
          retention-days: 30

      - name: Deploy APKs to server (SCP)
        if: ${{ secrets.DEPLOY_SSH_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/isp-platform}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p ${DEPLOY_PATH}/public/downloads"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            public/downloads/isp-radiant.apk \
            public/downloads/isp-mfs-verify.apk \
            public/downloads/mfs-verify-version.json \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/public/downloads/"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "cd ${DEPLOY_PATH} && \
             chown www-data:www-data public/downloads/*.apk public/downloads/*.json 2>/dev/null || true && \
             chmod 644 public/downloads/*.apk public/downloads/*.json && \
             ./scripts/use-server-mobile-downloads.sh --write-env && \
             php artisan config:cache --no-interaction 2>/dev/null || true"
          echo "Deployed to ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/public/downloads/"
          echo "Radiant: ${APP_URL}/downloads/isp-radiant.apk"
          echo "MFS:     ${APP_URL}/downloads/isp-mfs-verify.apk"
