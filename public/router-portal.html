<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ISP Billing Portal</title>
    <script>
        (function () {
            var target = '/router';
            try {
                if (window.top !== window.self) {
                    window.top.location.href = target;
                } else {
                    window.location.replace(target);
                }
            } catch (e) {
                window.location.replace(target);
            }
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=/router">
</head>
<body>
    <p><a href="/router">Open billing portal</a></p>
</body>
</html>
