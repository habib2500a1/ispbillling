name: isp_radiant
description: Radiant ISP — one app for Admin/Staff and Clients (same APK).
publish_to: 'none'
version: 3.3.7+50

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.4
  fl_chart: ^0.70.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  mobile_scanner: ^6.0.2
  telephony: ^0.2.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  local_auth: ^2.3.0
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/radiant_logo.png
    - assets/images/radiant_app_icon.png
